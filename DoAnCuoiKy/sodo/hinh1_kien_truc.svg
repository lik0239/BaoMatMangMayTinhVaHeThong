<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e7d4f"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6a3fb5"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker></defs><text x="800" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1d2733" text-anchor="middle"><tspan x="800" dy="0">Kiến trúc VeriGuard theo vùng (Internet → DMZ → App → Data, MGMT) và mô hình PDP/PEP</tspan></text><rect x="20" y="70" width="290" height="880" rx="14" fill="#fdf0ee" stroke="#b3261e" stroke-width="1.5" stroke-dasharray="10 6"/><text x="34" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#b3261e" text-anchor="start"><tspan x="34" dy="0">ZONE A · INTERNET (không tin cậy)</tspan></text><rect x="340" y="70" width="260" height="880" rx="14" fill="#fff6e6" stroke="#b26a00" stroke-width="1.5" stroke-dasharray="10 6"/><text x="354" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#b26a00" text-anchor="start"><tspan x="354" dy="0">ZONE B · DMZ</tspan></text><rect x="630" y="70" width="430" height="880" rx="14" fill="#edf4fc" stroke="#1f5fa8" stroke-width="1.5" stroke-dasharray="10 6"/><text x="644" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f5fa8" text-anchor="start"><tspan x="644" dy="0">ZONE C · APP – VeriGuard</tspan></text><rect x="1090" y="70" width="270" height="520" rx="14" fill="#ecf7f1" stroke="#1e7d4f" stroke-width="1.5" stroke-dasharray="10 6"/><text x="1104" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e7d4f" text-anchor="start"><tspan x="1104" dy="0">ZONE D · DATA</tspan></text><rect x="1090" y="650" width="270" height="300" rx="14" fill="#f4effb" stroke="#6a3fb5" stroke-width="1.5" stroke-dasharray="10 6"/><text x="1104" y="676" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#6a3fb5" text-anchor="start"><tspan x="1104" dy="0">ZONE E · MGMT / SECRETS</tspan></text><rect x="1390" y="70" width="190" height="880" rx="14" fill="#f4f4f4" stroke="#5b6776" stroke-width="1.5" stroke-dasharray="10 6"/><text x="1404" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#5b6776" text-anchor="start"><tspan x="1404" dy="0">BÊN NGOÀI</tspan></text><rect x="40" y="110" width="250" height="90" rx="10" fill="#ffffff" stroke="#b26a00" stroke-width="2.2"/><text x="54" y="137" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#b26a00" text-anchor="start"><tspan x="54" dy="0">Email</tspan></text><text x="54" y="161.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1d2733" text-anchor="start"><tspan x="54" dy="0">tên miền / nội dung</tspan><tspan x="54" dy="19.5">có thể giả mạo</tspan></text><rect x="40" y="215" width="250" height="90" rx="10" fill="#ffffff" stroke="#b26a00" stroke-width="2.2"/><text x="54" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#b26a00" text-anchor="start"><tspan x="54" dy="0">Chat / Zalo</tspan></text><text x="54" y="266.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1d2733" text-anchor="start"><tspan x="54" dy="0">tài khoản có thể</tspan><tspan x="54" dy="19.5">bị chiếm</tspan></text><rect x="40" y="320" width="250" height="90" rx="10" fill="#ffffff" stroke="#b26a00" stroke-width="2.2"/><text x="54" y="347" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#b26a00" text-anchor="start"><tspan x="54" dy="0">Cuộc gọi / Video call</tspan></text><text x="54" y="371.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1d2733" text-anchor="start"><tspan x="54" dy="0">giọng nói, khuôn mặt</tspan><tspan x="54" dy="19.5">có thể là deepfake</tspan></text><rect x="40" y="470" width="250" height="115" rx="10" fill="#fff7f6" stroke="#b3261e" stroke-width="2.2"/><text x="54" y="497" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#b3261e" text-anchor="start"><tspan x="54" dy="0">Kẻ tấn công</tspan></text><text x="54" y="521.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1d2733" text-anchor="start"><tspan x="54" dy="0">deepfake giám đốc, email</tspan><tspan x="54" dy="19.5">tên miền nhái, hộp thư</tspan><tspan x="54" dy="19.5">bị chiếm, đổi số tài khoản</tspan></text><rect x="40" y="680" width="250" height="160" rx="10" fill="#f3fbf6" stroke="#1e7d4f" stroke-width="2.2"/><text x="54" y="707" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1e7d4f" text-anchor="start"><tspan x="54" dy="0">Thiết bị đã đăng ký</tspan></text><text x="54" y="731.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1d2733" text-anchor="start"><tspan x="54" dy="0">App VeriGuard trên điện thoại</tspan><tspan x="54" dy="19.5">khoá riêng Ed25519 trong</tspan><tspan x="54" dy="19.5">Secure Element (không rời</tspan><tspan x="54" dy="19.5">thiết bị) · hiển thị số tiền,</tspan><tspan x="54" dy="19.5">người nhận trước khi ký</tspan></text><rect x="360" y="110" width="220" height="120" rx="10" fill="#ffffff" stroke="#b26a00" stroke-width="2.2"/><text x="374" y="137" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#b26a00" text-anchor="start"><tspan x="374" dy="0">Email Security GW</tspan></text><text x="374" y="161.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1d2733" text-anchor="start"><tspan x="374" dy="0">SPF / DKIM / DMARC</tspan><tspan x="374" dy="19.5">chặn tên miền nhái</tspan><tspan x="374" dy="19.5">(đọc từ phải sang trái)</tspan></text><rect x="360" y="300" width="220" height="140" rx="10" fill="#ffffff" stroke="#b26a00" stroke-width="2.2"/><text x="374" y="327" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#b26a00" text-anchor="start"><tspan x="374" dy="0">API Gateway + WAF</tspan></text><text x="374" y="351.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1d2733" text-anchor="start"><tspan x="374" dy="0">TLS (in transit)</tspan><tspan x="374" dy="19.5">rate limit</tspan><tspan x="374" dy="19.5">xác thực phiên +</tspan><tspan x="374" dy="19.5">re-auth khi chuyển tiền</tspan></text><rect x="360" y="690" width="220" height="140" rx="10" fill="#ffffff" stroke="#b26a00" stroke-width="2.2"/><text x="374" y="717" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#b26a00" text-anchor="start"><tspan x="374" dy="0">Cổng xác minh</tspan></text><text x="374" y="741.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1d2733" text-anchor="start"><tspan x="374" dy="0">push thử thách tới</tspan><tspan x="374" dy="19.5">thiết bị đã đăng ký</tspan><tspan x="374" dy="19.5">nhận phản hồi đã ký</tspan></text><rect x="650" y="105" width="390" height="85" rx="10" fill="#ffffff" stroke="#1f5fa8" stroke-width="2.2"/><text x="664" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f5fa8" text-anchor="start"><tspan x="664" dy="0">Tiếp nhận yêu cầu</tspan></text><text x="664" y="156.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1d2733" text-anchor="start"><tspan x="664" dy="0">chuẩn hoá + tính digest SHA-256 của</tspan><tspan x="664" dy="19.5">(người yêu cầu, số tiền, TK, tên nhận)</tspan></text><rect x="650" y="215" width="390" height="175" rx="10" fill="#f7fbff" stroke="#1f5fa8" stroke-width="2.2"/><text x="664" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f5fa8" text-anchor="start"><tspan x="664" dy="0">PDP · Policy Decision Point</tspan></text><text x="664" y="266.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1d2733" text-anchor="start"><tspan x="664" dy="0">Risk Engine (Context Signals): kênh,</tspan><tspan x="664" dy="19.5">người thụ hưởng mới, hạn mức, giờ,</tspan><tspan x="664" dy="19.5">ngôn ngữ thúc ép, tên miền nhái, DMARC,</tspan><tspan x="664" dy="19.5">deepfake score (chỉ tín hiệu phụ)</tspan><tspan x="664" dy="19.5">→ ALLOW / STEP-UP / DUAL / DENY</tspan></text><rect x="650" y="420" width="185" height="135" rx="10" fill="#ffffff" stroke="#1f5fa8" stroke-width="2.2"/><text x="664" y="447" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f5fa8" text-anchor="start"><tspan x="664" dy="0">Xác minh OOB</tspan></text><text x="664" y="471.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1d2733" text-anchor="start"><tspan x="664" dy="0">nonce CSPRNG</tspan><tspan x="664" dy="19.5">hết hạn 5 phút</tspan><tspan x="664" dy="19.5">dùng 1 lần</tspan><tspan x="664" dy="19.5">tối đa 3 lần gửi</tspan></text><rect x="855" y="420" width="185" height="135" rx="10" fill="#ffffff" stroke="#1f5fa8" stroke-width="2.2"/><text x="869" y="447" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f5fa8" text-anchor="start"><tspan x="869" dy="0">Phê duyệt kép</tspan></text><text x="869" y="471.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1d2733" text-anchor="start"><tspan x="869" dy="0">người duyệt độc lập</tspan><tspan x="869" dy="19.5">không tự duyệt</tspan><tspan x="869" dy="19.5">ký Ed25519 trên</tspan><tspan x="869" dy="19.5">digest giao dịch</tspan></text><rect x="650" y="590" width="390" height="125" rx="10" fill="#f7fbff" stroke="#1f5fa8" stroke-width="2.2"/><text x="664" y="617" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f5fa8" text-anchor="start"><tspan x="664" dy="0">PEP · Policy Enforcement Point</tspan></text><text x="664" y="641.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1d2733" text-anchor="start"><tspan x="664" dy="0">digest có đổi không? đủ bước chưa?</tspan><tspan x="664" dy="19.5">hết thời gian chờ 30&#x27; (TK mới) chưa?</tspan><tspan x="664" dy="19.5">→ mới phát lệnh chuyển tiền</tspan></text><rect x="650" y="760" width="390" height="90" rx="10" fill="#fff7f6" stroke="#b3261e" stroke-width="2.2"/><text x="664" y="787" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#b3261e" text-anchor="start"><tspan x="664" dy="0">Cảnh báo SOC</tspan></text><text x="664" y="811.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1d2733" text-anchor="start"><tspan x="664" dy="0">DENY · chữ ký sai · &#x27;Không phải tôi&#x27;</tspan><tspan x="664" dy="19.5">spam xác minh (MFA fatigue)</tspan></text><rect x="1110" y="105" width="230" height="150" rx="10" fill="#ffffff" stroke="#1e7d4f" stroke-width="2.2"/><text x="1124" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1e7d4f" text-anchor="start"><tspan x="1124" dy="0">Danh bạ tin cậy</tspan></text><text x="1124" y="156.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1d2733" text-anchor="start"><tspan x="1124" dy="0">khoá công khai thiết bị</tspan><tspan x="1124" dy="19.5">số ĐT đã xác minh</tspan><tspan x="1124" dy="19.5">hạn mức, quyền duyệt</tspan><tspan x="1124" dy="19.5">người thụ hưởng đã XM</tspan></text><rect x="1110" y="280" width="230" height="105" rx="10" fill="#ffffff" stroke="#1e7d4f" stroke-width="2.2"/><text x="1124" y="307" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1e7d4f" text-anchor="start"><tspan x="1124" dy="0">CSDL giao dịch</tspan></text><text x="1124" y="331.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1d2733" text-anchor="start"><tspan x="1124" dy="0">mã hoá at rest</tspan><tspan x="1124" dy="19.5">(AES-GCM, envelope)</tspan></text><rect x="1110" y="410" width="230" height="145" rx="10" fill="#ffffff" stroke="#1e7d4f" stroke-width="2.2"/><text x="1124" y="437" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1e7d4f" text-anchor="start"><tspan x="1124" dy="0">Audit Log</tspan></text><text x="1124" y="461.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1d2733" text-anchor="start"><tspan x="1124" dy="0">chuỗi HMAC-SHA256</tspan><tspan x="1124" dy="19.5">append-only (WORM)</tspan><tspan x="1124" dy="19.5">không ghi giá trị khoá</tspan></text><rect x="1110" y="690" width="230" height="115" rx="10" fill="#ffffff" stroke="#6a3fb5" stroke-width="2.2"/><text x="1124" y="717" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#6a3fb5" text-anchor="start"><tspan x="1124" dy="0">KMS / HSM</tspan></text><text x="1124" y="741.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1d2733" text-anchor="start"><tspan x="1124" dy="0">khoá HMAC audit, KEK</tspan><tspan x="1124" dy="19.5">không rời phần cứng</tspan><tspan x="1124" dy="19.5">xoay vòng, thu hồi</tspan></text><rect x="1110" y="822" width="230" height="110" rx="10" fill="#ffffff" stroke="#6a3fb5" stroke-width="2.2"/><text x="1124" y="849" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#6a3fb5" text-anchor="start"><tspan x="1124" dy="0">PAM</tspan></text><text x="1124" y="873.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1d2733" text-anchor="start"><tspan x="1124" dy="0">quản trị tạm thời</tspan><tspan x="1124" dy="19.5">(đăng ký thiết bị,</tspan><tspan x="1124" dy="19.5">sửa danh bạ) có log</tspan></text><rect x="1405" y="545" width="160" height="160" rx="10" fill="#ffffff" stroke="#5b6776" stroke-width="2.2"/><text x="1419" y="572" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#5b6776" text-anchor="start"><tspan x="1419" dy="0">Ngân hàng</tspan></text><text x="1419" y="596.3" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="normal" fill="#1d2733" text-anchor="start"><tspan x="1419" dy="0">Core banking</tspan><tspan x="1419" dy="19.5">API chuyển tiền</tspan><tspan x="1419" dy="19.5">mTLS + ký lệnh</tspan></text><path d="M290,160 L360,160" fill="none" stroke="#1d2733" stroke-width="2.2" marker-end="url(#a-ink)"/><path d="M290,260 L318,260 L318,350 L360,350" fill="none" stroke="#1d2733" stroke-width="2.2" marker-end="url(#a-ink)"/><path d="M290,365 L332,365 L332,400 L360,400" fill="none" stroke="#1d2733" stroke-width="2.2" marker-end="url(#a-ink)"/><path d="M165,470 L165,412" fill="none" stroke="#b3261e" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a-red)"/><text x="205" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#b3261e" text-anchor="middle"><tspan x="205" dy="0">giả mạo</tspan></text><path d="M580,160 L650,160" fill="none" stroke="#1d2733" stroke-width="2.2" marker-end="url(#a-ink)"/><path d="M580,370 L612,370 L612,178 L650,178" fill="none" stroke="#1d2733" stroke-width="2.2" marker-end="url(#a-ink)"/><path d="M845,190 L845,215" fill="none" stroke="#1d2733" stroke-width="2.2" marker-end="url(#a-ink)"/><path d="M742,390 L742,420" fill="none" stroke="#1d2733" stroke-width="2.2" marker-end="url(#a-ink)"/><path d="M947,390 L947,420" fill="none" stroke="#1d2733" stroke-width="2.2" marker-end="url(#a-ink)"/><path d="M1040,260 L1075,260 L1075,180 L1110,180" fill="none" stroke="#1e7d4f" stroke-width="2.2" marker-end="url(#a-green)"/><text x="1075" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1e7d4f" text-anchor="middle"><tspan x="1075" dy="0">tra cứu</tspan></text><path d="M650,490 L622,490 L622,725 L580,725" fill="none" stroke="#1f5fa8" stroke-width="2.2" marker-end="url(#a-blue)"/><text x="606" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f5fa8" text-anchor="end"><tspan x="606" dy="0">push</tspan><tspan x="606" dy="16.900000000000002">thử</tspan><tspan x="606" dy="16.900000000000002">thách</tspan></text><path d="M360,725 L290,725" fill="none" stroke="#1f5fa8" stroke-width="2.2" marker-end="url(#a-blue)"/><path d="M290,800 L360,800" fill="none" stroke="#1e7d4f" stroke-width="2.2" marker-end="url(#a-green)"/><text x="325" y="822" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1e7d4f" text-anchor="middle"><tspan x="325" dy="0">chữ ký</tspan><tspan x="325" dy="14.95">Ed25519</tspan></text><path d="M580,800 L636,800 L636,535 L650,535" fill="none" stroke="#1e7d4f" stroke-width="2.2" marker-end="url(#a-green)"/><path d="M742,555 L742,590" fill="none" stroke="#1d2733" stroke-width="2.2" marker-end="url(#a-ink)"/><path d="M947,555 L947,590" fill="none" stroke="#1d2733" stroke-width="2.2" marker-end="url(#a-ink)"/><path d="M1040,622 L1405,622" fill="none" stroke="#1d2733" stroke-width="2.2" marker-end="url(#a-ink)"/><text x="1250" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#1d2733" text-anchor="middle"><tspan x="1250" dy="0">lệnh đã đủ điều kiện</tspan></text><path d="M845,715 L845,760" fill="none" stroke="#b3261e" stroke-width="2.2" marker-end="url(#a-red)"/><path d="M1040,480 L1110,480" fill="none" stroke="#1e7d4f" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a-green)"/><text x="1075" y="502" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#1e7d4f" text-anchor="middle"><tspan x="1075" dy="0">mọi</tspan><tspan x="1075" dy="14.95">sự kiện</tspan></text><path d="M1340,747 L1376,747 L1376,500 L1340,500" fill="none" stroke="#6a3fb5" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a-purple)"/></svg>